<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}PalermitanHost{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
<nav class="nav">
  <a class="nav-brand" href="{{ url_for('dashboard') }}">🏠 PalermitanHost</a>
  <div class="nav-links">
    <a href="{{ url_for('dashboard') }}" {% if request.endpoint=='dashboard' %}class="active"{% endif %}>Dashboard</a>
    <a href="{{ url_for('propiedades') }}" {% if 'propiedad' in request.endpoint %}class="active"{% endif %}>Propiedades</a>
    <a href="{{ url_for('importar') }}" {% if 'importar' in request.endpoint %}class="active"{% endif %}>Importar</a>
    <a href="{{ url_for('competencia') }}" {% if request.endpoint=='competencia' %}class="active"{% endif %}>Competencia</a>
    <a href="{{ url_for('precios') }}" {% if request.endpoint=='precios' %}class="active"{% endif %}>Precios</a>
    <a href="{{ url_for('asistente') }}" {% if request.endpoint=='asistente' %}class="active"{% endif %}>Asistente</a>
    <a href="{{ url_for('informes') }}" {% if 'informe' in request.endpoint %}class="active"{% endif %}>Informes</a>
    <a href="{{ url_for('logout') }}" class="logout">Salir</a>
  </div>
</nav>

<main class="main">
  {% with msgs = get_flashed_messages(with_categories=True) %}
    {% for cat, msg in msgs %}
      <div class="alert alert-{{ cat }}">{{ msg }}</div>
    {% endfor %}
  {% endwith %}

  {% block content %}{% endblock %}
</main>

<script src="{{ url_for('static', filename='app.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
